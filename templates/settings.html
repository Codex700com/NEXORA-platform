{% extends 'base.html' %}{% block content %}<div class="title">Settings</div><form method="post"><div class="section"><h2>Profile</h2><label>Display name</label><div class="field"><input name="display_name" value="{{user.display_name}}"></div><p class="muted">Phone: {{user.phone}}</p></div><div class="section"><h2>Payout details</h2><div class="field"><input name="mtn_number" value="{{user.mtn_number}}" placeholder="MTN Uganda number"></div><div class="field"><input name="airtel_number" value="{{user.airtel_number}}" placeholder="Airtel Uganda number"></div><div class="field"><input name="usdt_wallet" value="{{user.usdt_wallet}}" placeholder="USDT TRC20 address"></div></div><div class="section"><h2>Notifications</h2><label><input type="checkbox" name="notifications" {% if user.notifications_enabled %}checked{% endif %} style="width:auto"> Push & in-app notifications</label></div><button class="button primary">Save changes</button></form>{% endblock %}
