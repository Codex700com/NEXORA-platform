{% extends "base.html" %}
{% block content %}
<div class="title">Admin Activity</div>

<div class="section">
{% for a in activity %}
<div class="row">
<span>{{ a.action }} — {{ a.details }}</span>
<small>{{ a.created_at }}</small>
</div>
{% else %}
<p class="muted">No admin activity yet.</p>
{% endfor %}
</div>

{% endblock %}
